# G0–G4-automatik. Ingen riktig användardata i CI; endast lokal Supabase i containern och syntetiska konton.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:reference
      - run: npx vitest run --project unit --project ui
      - name: Inga hemligheter i bygget
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          npx vite build
          ! grep -rE "c2VydmljZV9yb2xl|sb_secret_[A-Za-z0-9]" dist/assets

  db-and-e2e:
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Lokal Supabase (migrationer körs vid start)
        run: npx supabase start
      - name: Skriv lokal klientmiljö (endast anon-nyckel)
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d'"' -f2)" >> .env.local
      - name: RLS-, RPC- och demotester mot riktig Postgres
        run: npx vitest run --project db
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            playwright-report
            docs/evidence
